name: Deploy invitation

# Patches the AR day count at deploy time instead of committing the binaries.
# Keeps ~9 MB of models out of git history on every run.

on:
  push:
    branches: [main]
  schedule:
    - cron: "35 18 * * *"      # 00:05 IST, just after the day rolls over
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet usd-core
      - run: python3 update_countdown.py
      - run: python3 update_countdown.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
